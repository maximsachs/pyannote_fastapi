name: Release images for new pyannote.audio versions

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-pyannote-${{ github.workflow }}
  cancel-in-progress: false

env:
  IMAGE_NAME: pyannote_fastapi

jobs:
  maybe-release:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: pyannote_fastapi
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve latest pyannote.audio version
        id: pypi
        run: |
          VERSION="$(curl -fsSL https://pypi.org/pypi/pyannote.audio/json | jq -r '.info.version')"
          if [ -z "${VERSION}" ] || [ "${VERSION}" = "null" ]; then
            echo "Failed to read pyannote.audio version from PyPI" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "major_minor=$(echo "${VERSION}" | cut -d. -f1-2)" >> "${GITHUB_OUTPUT}"
          echo "major=$(echo "${VERSION}" | cut -d. -f1)" >> "${GITHUB_OUTPUT}"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      - name: Check Docker Hub tag
        id: dh
        env:
          VERSION: ${{ steps.pypi.outputs.version }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          code="$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/${IMAGE_NAME}/tags/${VERSION}/")"
          echo "http_code=${code}" >> "${GITHUB_OUTPUT}"

      - name: Skip if image already published
        if: ${{ steps.dh.outputs.http_code == '200' }}
        run: |
          echo "Docker Hub already has tag ${{ steps.pypi.outputs.version }}; nothing to do."

      - name: Configure git user
        if: ${{ steps.dh.outputs.http_code != '200' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create git tag (if missing) and push
        if: ${{ steps.dh.outputs.http_code != '200' }}
        env:
          VERSION: ${{ steps.pypi.outputs.version }}
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          if git ls-remote --tags origin | grep -q "refs/tags/v${VERSION}$"; then
            echo "Remote tag v${VERSION} already exists; skipping tag push."
          else
            git tag -a "v${VERSION}" -m "pyannote.audio ${VERSION}"
            git push origin "refs/tags/v${VERSION}"
          fi

      - name: Resolve PyTorch base image
        id: base
        if: ${{ steps.dh.outputs.http_code != '200' }}
        env:
          PYANNOTE_VERSION: ${{ steps.pypi.outputs.version }}
        run: |
          BASE="$(scripts/resolve-pytorch-base.sh)"
          echo "pytorch_base=${BASE}" >> "${GITHUB_OUTPUT}"
          echo "PyTorch base image: ${BASE}"

      - name: Set up Docker Buildx
        if: ${{ steps.dh.outputs.http_code != '200' }}
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: ${{ steps.dh.outputs.http_code != '200' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: ${{ steps.dh.outputs.http_code != '200' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (CUDA)
        if: ${{ steps.dh.outputs.http_code != '200' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            PYTORCH_BASE=${{ steps.base.outputs.pytorch_base }}
            PYANNOTE_VERSION=${{ steps.pypi.outputs.version }}
            BUILD_DATE=${{ steps.pypi.outputs.build_date }}
            VCS_REF=${{ github.sha }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.pypi.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.pypi.outputs.major_minor }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.pypi.outputs.major }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.pypi.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.pypi.outputs.major_minor }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.pypi.outputs.major }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Build and push (CPU)
        if: ${{ steps.dh.outputs.http_code != '200' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.cpu
          push: true
          platforms: linux/amd64
          build-args: |
            PYANNOTE_VERSION=${{ steps.pypi.outputs.version }}
            BUILD_DATE=${{ steps.pypi.outputs.build_date }}
            VCS_REF=${{ github.sha }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.pypi.outputs.version }}-cpu
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.pypi.outputs.major_minor }}-cpu
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.pypi.outputs.major }}-cpu
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest-cpu
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.pypi.outputs.version }}-cpu
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.pypi.outputs.major_minor }}-cpu
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.pypi.outputs.major }}-cpu
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest-cpu
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Create or update GitHub Release
        if: ${{ steps.dh.outputs.http_code != '200' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.pypi.outputs.version }}
          MAJOR_MINOR: ${{ steps.pypi.outputs.major_minor }}
          MAJOR: ${{ steps.pypi.outputs.major }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          BUILD_DATE: ${{ steps.pypi.outputs.build_date }}
        run: |
          NOTES_FILE="$(mktemp)"
          cat >"${NOTES_FILE}" <<EOF
          Automated build for pyannote.audio ${VERSION} (built ${BUILD_DATE}).

          Upstream changelog: https://github.com/pyannote/pyannote-audio/blob/main/CHANGELOG.md

          ## Docker Hub

          - https://hub.docker.com/r/${DOCKERHUB_USERNAME}/${IMAGE_NAME}/tags?name=${VERSION}
          - \`docker pull ${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${VERSION}\` (CUDA)
          - \`docker pull ${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${VERSION}-cpu\` (CPU)

          Rolling tags also updated: \`${MAJOR_MINOR}\`, \`${MAJOR}\`, \`latest\` (and \`-cpu\` variants).

          ## GHCR

          - https://github.com/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}/pkgs/container/${IMAGE_NAME}
          - \`docker pull ghcr.io/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}:${VERSION}\` (CUDA)
          - \`docker pull ghcr.io/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}:${VERSION}-cpu\` (CPU)
          EOF

          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "GitHub Release v${VERSION} already exists; updating notes."
            gh release edit "v${VERSION}" \
              --title "pyannote.audio ${VERSION}" \
              --notes-file "${NOTES_FILE}"
          else
            gh release create "v${VERSION}" \
              --title "pyannote.audio ${VERSION}" \
              --notes-file "${NOTES_FILE}"
          fi

      - name: Update README with built pyannote.audio version
        # Bumping README.md on main both documents the latest build and resets
        # the 60-day scheduled-workflow inactivity clock. Commits made with
        # GITHUB_TOKEN do not trigger other workflows, so build-on-push.yml
        # will not re-fire from this push.
        if: ${{ steps.dh.outputs.http_code != '200' }}
        env:
          VERSION: ${{ steps.pypi.outputs.version }}
          BUILD_DATE: ${{ steps.pypi.outputs.build_date }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["VERSION"]
          build_date = os.environ["BUILD_DATE"]
          readme = pathlib.Path("README.md")
          text = readme.read_text(encoding="utf-8")
          start = "<!-- pyannote-version:start -->"
          end = "<!-- pyannote-version:end -->"
          block = (
              f"{start}\n"
              f"**Latest published images build against "
              f"[`pyannote.audio` {version}]"
              f"(https://pypi.org/project/pyannote.audio/{version}/)"
              f" — built {build_date}.**\n"
              f"{end}"
          )
          new_text, count = re.subn(
              rf"{re.escape(start)}.*?{re.escape(end)}",
              block,
              text,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit(
                  "README.md is missing the pyannote-version marker block; "
                  "cannot update version line."
              )
          readme.write_text(new_text, encoding="utf-8")
          PY

          git add README.md
          if git diff --cached --quiet; then
            echo "README already up to date."
            exit 0
          fi
          git commit -m "docs: built against pyannote.audio ${VERSION}"
          git push origin main
